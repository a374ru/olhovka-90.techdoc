name:  Deploy Manual to Firebase
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Folder Public to Docs
        run: cp -r public/* docs/

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git diff-index --quiet HEAD || git commit -m "Copy contents from folder public to docs"
          git push origin main


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.FB_OLHOVKA_90_ID }} --token ${{ secrets.FB_OLHOVKA_90_TOKEN }}